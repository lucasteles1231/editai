name: versão

# Publica uma versão quando a tag vX.Y.Z chega ao GitHub (instalador/nova_versao.py prepara o
# número e o CHANGELOG; a tag é o último passo). Antes, os testes inteiros rodam de novo.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  testes:
    uses: ./.github/workflows/testes.yml

  publicar:
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # para chamar o site.yml: uma release criada com o token do próprio workflow não
      # dispara o "release: published" de outro workflow (regra do GitHub)
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: a tag é a versão do pyproject, do editor e do CHANGELOG
        run: uv run python instalador/montar.py --conferir "$GITHUB_REF_NAME"
      - run: uv build --wheel --out-dir anexos
      - run: uv run --no-project python instalador/montar.py anexos
      - name: publica a versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" anexos/* \
            --title "Editai ${GITHUB_REF_NAME#v}" --notes-file notas.md --verify-tag
      - name: refaz o site com a versão nova
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main
